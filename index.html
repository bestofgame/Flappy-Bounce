<!DOCTYPE html>
<html manifest="offline.appcache">
<head>
    <meta charset="UTF-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
	<title>Flappy Bounce - Ads Edition</title>
	
	<link rel="manifest" href="appmanifest.json" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, minimal-ui" />
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-status-bar-style" content="black" />
	<link rel="apple-touch-icon" sizes="256x256" href="icon-256.png" />
	<meta name="HandheldFriendly" content="true" />
	<meta name="mobile-web-app-capable" content="yes" />
	<link rel="shortcut icon" sizes="256x256" href="icon-256.png" />

	<style type="text/css">
    * {
        padding: 0;
        margin: 0;
    }
    html, body {
        background: #111; /* Fond très sombre pour voir les limites */
        color: #fff;
        overflow: hidden;
        touch-action: none;
        -ms-touch-action: none;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* CONTENEUR DU JEU RÉDUIT */
    #c2canvasdiv {
        width: 70vw !important; /* Le jeu ne prend que 70% de la largeur de l'écran */
        height: auto;
        max-width: 1000px; /* Largeur max pour laisser de la place aux pubs */
        position: relative;
        z-index: 1;
        box-shadow: 0 0 20px rgba(0,0,0,0.5); /* Ombre pour détacher le jeu */
    }

    canvas {
        width: 100% !important;
        height: auto !important;
    }

    /* BANNIÈRES GAUCHE ET DROITE */
    .ad-container {
        position: fixed;
        top: 50%;
        transform: translateY(-50%);
        width: 160px;
        height: 600px;
        z-index: 9999;
        background: #222; /* Fond de secours pour voir la zone */
        display: block !important; /* Force l'affichage */
    }
    
    .ad-left {
        left: 10px;
    }
    
    .ad-right {
        right: 10px;
    }

    /* Sur petit écran, on réduit encore plus le jeu */
    @media screen and (max-width: 1200px) {
        #c2canvasdiv {
            width: 50vw !important;
        }
    }
</style>
</head> 
 
<body> 
	<div id="fb-root"></div>
	
	<div class="ad-container ad-left">
		<script type="text/javascript">
			atOptions = {
				'key' : '9b61f7351b78d433de0ffc16189bc341',
				'format' : 'iframe',
				'height' : 600,
				'width' : 160,
				'params' : {}
			};
		</script>
		<script type="text/javascript" src="https://www.highperformanceformat.com/9b61f7351b78d433de0ffc16189bc341/invoke.js"></script>
	</div>

	<div class="ad-container ad-right">
		<script type="text/javascript">
			atOptions = {
				'key' : '9b61f7351b78d433de0ffc16189bc341',
				'format' : 'iframe',
				'height' : 600,
				'width' : 160,
				'params' : {}
			};
		</script>
		<script type="text/javascript" src="https://www.highperformanceformat.com/9b61f7351b78d433de0ffc16189bc341/invoke.js"></script>
	</div>

	<div id="c2canvasdiv">
		<canvas id="c2canvas" width="1280" height="720">
			<h1>Your browser does not appear to support HTML5.</h1>
		</canvas>
	</div>
	
	<script src="jquery-2.1.1.min.js"></script>
	<script src="c2runtime.js"></script>

    <script>
		jQuery(window).resize(function() {
			cr_sizeCanvas(jQuery(window).width(), jQuery(window).height());
		});
		
		jQuery(document).ready(function ()
		{			
			cr_createRuntime("c2canvas");
		});
		
		function onVisibilityChanged() {
			if (document.hidden || document.mozHidden || document.webkitHidden || document.msHidden)
				cr_setSuspended(true);
			else
				cr_setSuspended(false);
		};
		
		document.addEventListener("visibilitychange", onVisibilityChanged, false);
		document.addEventListener("mozvisibilitychange", onVisibilityChanged, false);
		document.addEventListener("webkitvisibilitychange", onVisibilityChanged, false);
		document.addEventListener("msvisibilitychange", onVisibilityChanged, false);
		
		if (navigator.serviceWorker && navigator.serviceWorker.register)
		{
			navigator.serviceWorker.register("sw.js", { scope: "./" });
		}
    </script>
</body> 
</html>
